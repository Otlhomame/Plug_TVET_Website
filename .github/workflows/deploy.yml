# ===========================================================================
# THE PLUG TVET - GitHub Pages CI/CD pipeline
# ---------------------------------------------------------------------------
# Trigger: every push to `main` (text edits, new PDF reports, new blog posts)
# or a manual run from the Actions tab.
#
# What it does:
#   1. Checks out the repo and installs Node 20 with npm caching.
#   2. Runs `npm ci` (reproducible install from package-lock.json).
#   3. Runs `next build` which emits the flat static site into `/out`
#      (because `output: 'export'` is set in next.config.js).
#   4. Uploads `/out` as a Pages artifact and publishes it live.
#
# ONE-TIME SETUP: Repo -> Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". That is all that is required.
#
# !! DO NOT SELECT "Deploy from a branch" !!
# ---------------------------------------------------------------------------
# If Pages Source is ever set to "Deploy from a branch", GitHub stops running
# this workflow and instead creates a DYNAMIC workflow called
# `pages-build-deployment` (path: dynamic/pages/pages-build-deployment) that
# runs Jekyll over the repo root.
#
# Because the Next.js source has no root `index.html` (it is only produced by
# `next build` into /out), that Jekyll run still reports SUCCESS but publishes
# a site with NO index page. Visitors then see GitHub's
# "404 - There isn't a GitHub Pages site here" page on the custom domain, and
# `GET /repos/{owner}/{repo}/pages` starts returning 404.
#
# Symptom checklist for that failure mode:
#   - Actions shows a run named "pages build and deployment" (event: dynamic)
#   - The workflow list shows `dynamic/pages/pages-build-deployment`
#   - https://<user>.github.io/<repo>/ returns 404
# Fix: Settings -> Pages -> Source = "GitHub Actions", then re-run this workflow.
# ===========================================================================

name: Deploy THE PLUG TVET to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual deployments from the Actions tab.
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at the same time; queue instead and cancel
# any in-progress run that is superseded by a newer commit.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ----------------------------------------------------------------
      # IMPORTANT: this site is served from a CUSTOM DOMAIN (plugtvet.com),
      # so it lives at the ROOT of the domain, not at /<repo>.
      #
      # `actions/configure-pages` reports `base_path = /Plug_TVET_Website`
      # for a project site. Using that value here would prefix every asset
      # with /Plug_TVET_Website and 404 on the custom domain, so we pin the
      # base path to empty while a custom domain is configured.
      #
      # If you ever go back to serving from https://<user>.github.io/<repo>/,
      # replace the empty NEXT_PUBLIC_BASE_PATH below with
      #   NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # to restore the project-site prefix.
      # ----------------------------------------------------------------
      - name: Build Next.js static export
        env:
          # Empty on purpose: custom domain => site is served from the root.
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: https://www.plugtvet.com
          NODE_ENV: production
        run: npm run build

      - name: Verify static export
        run: node scripts/verify-export.mjs

      # GitHub Pages runs Jekyll by default, which ignores folders that start
      # with an underscore (like `/_next`). The .nojekyll marker disables it.
      # It MUST be a truly empty file - Jekyll keys off its presence, and a
      # placeholder containing text is not a valid marker.
      - name: Add .nojekyll marker
        run: |
          rm -f out/.nojekyll
          : > out/.nojekyll
          test ! -s out/.nojekyll

      # Fail loudly instead of publishing a site with no landing page. A
      # missing out/index.html is exactly what produced the
      # "There isn't a GitHub Pages site here" 404.
      - name: Assert deployable site
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -f out/CNAME
          echo "index.html: $(wc -c < out/index.html) bytes"
          echo "CNAME: $(cat out/CNAME)"

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to Pages
        id: deployment
        uses: actions/deploy-pages@v4