<!-- THE PLUG TVET favicon - tuned for 16-32px browser tabs.
     Same outer contract: viewBox 0 0 48 48, exported at 64x64, rx=12 plate,
     2px chrome ring, bold "P" monogram on the brand blue + a thin band
     echoing the two-tone split of public/logo.svg.

     WHY THESE NUMBERS (at 16px, 1 unit = 16/48 = 0.333 device px, so anything
     under 3 units is a sub-pixel gap that antialiasing smears into a blob):
       The previous cut used font-size 26 with the band at y=33, leaving a
       2-unit (0.67px) gap between the P's baseline and the band - the two
       fused at tab size and the bowl's counter filled in. Verified against
       actual 16px renders (GDI+ Arial Black, cap = 0.716 em = 25.8 units):
         font-size 36    cap 25.8u = 8.6px (was 6.2px; P fills 54% of the tile)
         baseline y 32.9 top clearance 3.1u = 1.0px
         band y 37.4 h 3.5   P->band gap 4.5u = 1.5px, band->ring 3.1u = 1.0px
       Pixel tests at true 16px on both dark and light chrome: ring, P and
       band stay three separate components and the bowl counter survives.
       Do not shrink the gaps below 3 units without re-running the render. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="64" height="64" role="img" aria-label="THE PLUG TVET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fgBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1CC0FF"/>
      <stop offset="55%" stop-color="#1C7BEE"/>
      <stop offset="100%" stop-color="#123FAE"/>
    </linearGradient>
    <linearGradient id="fgRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#9AA7B4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="fgText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE4EC"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#fgBlue)" stroke="url(#fgRing)" stroke-width="2"/>
  <rect x="6" y="37.4" width="36" height="3.5" rx="1.75" fill="#F2F4F5" opacity="0.9"/>
  <text x="24" y="32.9" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="36" fill="url(#fgText)">P</text>
</svg>
