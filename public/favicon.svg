<!-- THE PLUG TVET favicon - rounded plug-node mark tuned for 16-32px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="64" height="64">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="#050912"/>
  <rect x="4" y="4" width="40" height="40" rx="11"
        fill="rgba(34,211,238,0.08)" stroke="url(#fg)" stroke-width="2"/>

  <!-- plug pins -->
  <path d="M19 9v5M29 9v5" stroke="url(#fg)" stroke-width="3" stroke-linecap="round"/>

  <!-- hub -->
  <rect x="14" y="15" width="20" height="9" rx="4.5"
        fill="rgba(34,211,238,0.18)" stroke="url(#fg)" stroke-width="2"/>

  <!-- network branches + nodes -->
  <path d="M24 24v4M24 28l-8 5M24 28l8 5" stroke="url(#fg)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="16" cy="35" r="3.2" fill="#2DD4BF"/>
  <circle cx="32" cy="35" r="3.2" fill="#22D3EE"/>
  <circle cx="24" cy="35" r="2.6" fill="#A5F3FC"/>
</svg>