<!-- THE PLUG TVET - standalone brand mark.
     Inline copy lives in src/components/Logo.jsx; this file is for emails,
     decks, social avatars and the Apple touch icon.

     Same outer contract as the previous version: viewBox 0 0 48 48,
     exported at 512x512, full-bleed dark background (the inline component
     stays transparent instead - see Logo.jsx). The artwork inside is the
     "THE PLUG / TVET" badge on its own 400x300 canvas, nested and centered
     here rather than redrawn to the old square's coordinate system: the two
     artworks don't share a shape vocabulary, so there is nothing to carry
     over from the old square's coordinates.

     THE NESTING IS LOAD-BEARING: because this is a landscape lockup inside a
     square file, how much of the 48x48 square the badge fills is set by the
     nested width/height alone. On the old 400x190 canvas it came out 40 x 19
     and filled only 40% of the square height, leaving the wordmark too small
     to read in an avatar or touch icon. On the 400x300 canvas it is 44 x 33
     and fills 69%, so the type is ~1.7x taller in the exported icon. If the
     badge canvas ever changes, re-derive these four numbers together:
       width  = 44                      (2-unit breathing margin on each side)
       height = 44 * (canvasH / 400)    (preserve the canvas aspect ratio)
       x      = (48 - width) / 2
       y      = (48 - height) / 2       (centred, never flush to an edge) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512" role="img" aria-label="THE PLUG TVET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="plugBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17B8FF"/>
      <stop offset="45%" stop-color="#1C7BEE"/>
      <stop offset="100%" stop-color="#1B3FB0"/>
    </linearGradient>
    <linearGradient id="chromeSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#F1F3F4"/>
      <stop offset="40%" stop-color="#D2D6D8"/>
      <stop offset="60%" stop-color="#E9EBEC"/>
      <stop offset="80%" stop-color="#C7CBCD"/>
      <stop offset="100%" stop-color="#F6F7F7"/>
    </linearGradient>
    <linearGradient id="seamGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC876" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFC876" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFC876" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chromeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#9AA7B4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="plugText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6DEE6"/>
    </linearGradient>
    <linearGradient id="tvetBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E86F5"/>
      <stop offset="100%" stop-color="#0B3EA6"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="3" y="3" width="394" height="294" rx="30"/>
    </clipPath>
  </defs>

  <!-- Full-bleed background (matches the previous file's convention) -->
  <rect width="48" height="48" fill="#050912"/>

  <!-- Badge artwork, authored on its own 400x300 canvas and centered here -->
  <svg x="2" y="7.5" width="44" height="33" viewBox="0 0 400 300">
    <rect x="1" y="1" width="398" height="298" rx="31" fill="none" stroke="#0B1220" stroke-width="2" opacity="0.55"/>
    <g clip-path="url(#badgeClip)">
      <rect x="3" y="3" width="394" height="147" fill="url(#plugBlue)"/>
      <rect x="3" y="150" width="394" height="147" fill="url(#chromeSilver)"/>
      <rect x="3" y="146" width="394" height="8" fill="url(#seamGlow)"/>
    </g>
    <rect x="3" y="3" width="394" height="294" rx="30" fill="none" stroke="url(#chromeBorder)" stroke-width="3.5"/>
    <text x="200" y="96" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="64" fill="url(#plugText)" textLength="356" lengthAdjust="spacingAndGlyphs">THE PLUG</text>
    <text x="200" y="256" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="100" fill="url(#tvetBlue)" textLength="290" lengthAdjust="spacingAndGlyphs">TVET</text>
  </svg>
</svg>
